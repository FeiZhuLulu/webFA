<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>WebFA Structured Reading</title>
</head>
<body>
  <header>
    <nav aria-label="Primary navigation">
      <a href="#report">Report</a>
      <a href="#filters">Filters</a>
    </nav>
  </header>
  <main id="report">
    <article aria-labelledby="report-title">
      <h1 id="report-title">Quarterly report</h1>
      <p>Revenue increased while operating costs decreased.</p>

      <section aria-labelledby="highlights-title">
        <h2 id="highlights-title">Highlights</h2>
        <ul aria-label="Quarter highlights">
          <li>Revenue increased</li>
          <li>Costs decreased</li>
        </ul>
      </section>

      <section aria-labelledby="metrics-title">
        <h2 id="metrics-title">Metrics</h2>
        <table aria-label="Quarterly metrics">
          <thead>
            <tr>
              <th scope="col">Metric</th>
              <th scope="col">Value</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <th scope="row">Revenue</th>
              <td>$120</td>
            </tr>
            <tr>
              <th scope="row">Costs</th>
              <td>$45</td>
            </tr>
          </tbody>
        </table>
      </section>

      <form id="filters" aria-label="Report filters">
        <label for="quarter">Quarter</label>
        <select id="quarter" name="quarter">
          <option value="q1">Q1</option>
          <option value="q2">Q2</option>
        </select>
        <label><input type="checkbox" name="archived"> Include archived</label>
        <button type="submit">Apply filters</button>
      </form>

      <div role="status" aria-live="polite">Report ready</div>
    </article>
  </main>
</body>
</html>
