<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Human Control Fixture</title>
  <style>
    body { font-family: sans-serif; margin: 32px; }
    input { width: 320px; padding: 12px; font-size: 18px; }
    button { margin-top: 18px; padding: 12px 18px; }
  </style>
</head>
<body>
  <h1>Human Control Fixture</h1>
  <form id="verification-form">
    <label for="human-input">Verification value</label>
    <input id="human-input" name="human-input" type="password" autofocus autocomplete="off" />
    <button id="confirm" type="submit">Confirm</button>
  </form>
  <p id="result">Waiting</p>
  <script>
    const form = document.getElementById('verification-form');
    const input = document.getElementById('human-input');
    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const valid = input.value === 'human-secret';
      document.getElementById('result').textContent = valid ? 'Confirmed' : 'Invalid';
      if (valid) form.remove();
    });
    input.addEventListener('input', () => {
      document.body.dataset.currentValue = input.value;
    });
  </script>
</body>
</html>
