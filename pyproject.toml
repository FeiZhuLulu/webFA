[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "webfa-desktop-runtime"
dynamic = ["version"]
description = "WebFA developer preview: local internet Runtime for external Agents over MCP"
license = "MIT"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.7",
  "SQLAlchemy>=2.0",
  "alembic>=1.13",
  "PyYAML>=6.0",
  "mcp>=1.0.0",
  "httpx>=0.27",
  "websockets>=12",
  "cryptography>=46.0"
]

[project.urls]
Homepage = "https://github.com/FeiZhuLulu/webFA"
Repository = "https://github.com/FeiZhuLulu/webFA.git"
Issues = "https://github.com/FeiZhuLulu/webFA/issues"

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "build>=1.2"
]

[project.scripts]
webfa = "apps.runtime.cli:main_webfa"
webfa-runtime = "apps.runtime.cli:main_runtime"
webfa-mcp = "apps.runtime.cli:main_mcp"

[tool.setuptools]
packages = [
  "apps",
  "apps.runtime",
  "apps.runtime.api",
  "apps.runtime.api.routes",
  "apps.runtime.mcp",
  "apps.runtime.worker",
  "storage",
  "schemas",
  "providers",
  "providers.mock",
  "providers.github",
  "providers.huggingface",
  "registry",
  "planner",
  "policy",
  "approvals",
  "execution",
  "verification",
  "proof",
  "audit",
  "workspace",
  "browser",
  "webfa_resources",
  "webfa_resources.blocked_paths",
  "webfa_resources.policies",
  "webfa_resources.transactions"
]

[tool.setuptools.package-dir]
"storage" = "packages/storage"
"schemas" = "packages/schemas"
"providers" = "packages/providers"
"providers.mock" = "packages/providers/mock"
"providers.github" = "packages/providers/github"
"providers.huggingface" = "packages/providers/huggingface"
"registry" = "packages/webfa-core/registry"
"planner" = "packages/webfa-core/planner"
"policy" = "packages/webfa-core/policy"
"approvals" = "packages/webfa-core/approvals"
"execution" = "packages/webfa-core/execution"
"verification" = "packages/webfa-core/verification"
"proof" = "packages/webfa-core/proof"
"audit" = "packages/webfa-core/audit"
"workspace" = "packages/webfa-core/workspace"
"browser" = "packages/webfa-core/browser"
"webfa_resources" = "resources"

[tool.setuptools.package-data]
"webfa_resources.blocked_paths" = ["*.yaml"]
"webfa_resources.policies" = ["*.yaml"]
"webfa_resources.transactions" = ["*.yaml"]

[tool.setuptools.dynamic]
version = {attr = "apps.runtime.version.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "packages", "packages/webfa-core"]
